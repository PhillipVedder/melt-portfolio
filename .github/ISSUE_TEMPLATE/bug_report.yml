name: Bug report
description: Report a reproducible problem in Melt.
title: 'Bug: '
body:
  - type: markdown
    attributes:
      value: "Never include API keys, private portfolio backups, or unredacted logs. Report security issues through the repository's private vulnerability reporting, not this form."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use virtual holdings and redact any private information.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/version, operating system, Node version, and Melt commit or release.
    validations:
      required: true
  - type: dropdown
    id: feed
    attributes:
      label: Market data state
      options:
        - Connected
        - Stale or disconnected
        - Unconfigured
        - Not relevant / unknown
