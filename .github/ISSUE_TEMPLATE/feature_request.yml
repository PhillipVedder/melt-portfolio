name: Feature request
description: Suggest a focused improvement to the sandbox.
title: 'Feature: '
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What task is difficult today, and who needs it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Include alternatives and any changes to accounting, market data, or accessibility.
    validations:
      required: true
